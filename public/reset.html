<body><main><span class="logo">V</span><p class="eyebrow">VANTIX ACCOUNT</p><h1>Vælg en ny adgangskode</h1><p>Dette ændrer din kontoadgangskode, ikke hovedadgangskoden til din krypterede boks.</p><form id="reset-form"><label for="password">Ny adgangskode</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Gentag adgangskode</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">Gem ny adgangskode</button></form><p id="status" role="status" aria-live="polite"></p></main></body></html>
